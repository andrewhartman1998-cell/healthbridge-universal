<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>SecureMail</title>
  <script>
    // GitHub Pages SPA redirect: preserve the path and redirect to index.html
    var seg = 1; // number of path segments to keep (1 = keep /healthbridge-universal/securevault)
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + seg).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(seg).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>Loading SecureMail…</body>
</html>
