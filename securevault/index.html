  <script>
(function() {
  // Handle GitHub Pages 404 redirect from root 404.html
  var query = window.location.search;
  if (query && query.startsWith('?p=/')) {
    var parts = query.slice(4).split('&q=');
    var path  = '/' + parts[0];
    var search = parts[1] ? '?' + parts[1] : '';
    window.history.replaceState(null, null, path + search + window.location.hash);
  }
  // Handle securevault-local 404.html redirect
  if (query && query.startsWith('?/')) {
    var decoded = query.slice(1).split('&').map(function(s){ return s.replace(/~and~/g,'&'); }).join('?');
    window.history.replaceState(null, null, window.location.pathname.slice(0,-1) + decoded + window.location.hash);
  }
})();
</script>
